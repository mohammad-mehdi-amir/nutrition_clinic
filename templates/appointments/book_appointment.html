{% extends "base.html" %}
{% load jalali_tags %}
{% block content %}

<div class="container mt-5">

    <h2>رزرو نوبت</h2>

    <form method="post" class="mt-4">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                پزشک
            </label>

            <select
                name="doctor"
                class="form-select"
                required
            >

                <option value="">
                    انتخاب پزشک
                </option>

                {% for doctor in doctors %}

                    <option value="{{ doctor.id }}">
                        {{ doctor.name }}
                        - {{ doctor.specialty }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">
            {{ form.date.label_tag }}
            {{ form.date }}
            
            {% if form.date.errors %}
                <div class="text-danger small mt-1">
                    {{ form.date.errors }}
                </div>
            {% endif %}
        </div>
        <button
            type="submit"
            class="btn btn-primary"
        >
            تأیید
        </button>
    </form>
</div>




    </form>

</div>


<script>

    $(document).ready(function () {

        $("#appointment-date").pDatepicker({

            format: "YYYY/MM/DD",

            autoClose: true,

            initialValue: false,

            observer: true,

        });

    });

</script>

{% endblock %}
